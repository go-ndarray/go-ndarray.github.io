baseURL = 'https://go-ndarray.github.io/'
locale  = 'en-us'
title   = 'go-ndarray'
# No theme -- the layout is the go-* family template go-fft.github.io uses
# (itself go-authn.github.io's): one self-contained layouts/index.html,
# partials/styles.html (inline :root tokens, a verbatim copy of go-fft's) and
# partials/theme-toggle.html (system / light / dark).

disableKinds = ['taxonomy', 'term', 'rss', 'sitemap', '404']

[markup.goldmark.renderer]
  unsafe = true

[params]
  description = "go-ndarray is a pure-Go (CGO=0) NumPy-style n-dimensional array library for float64 — slicing/views, broadcasting, ufuncs, reductions and linear algebra, multicore + SIMD on amd64, arm64, ppc64le, loong64 and riscv64, with a Workspace arena for loops."

[[params.repos]]
  name  = "ndarray"
  kind  = "library · v0.7.0"
  href  = "https://github.com/go-ndarray/ndarray"
  blurb = "The library. Creation (<code>Zeros</code>/<code>Arange</code>/<code>Linspace</code>/…), strided <strong>views</strong>, broadcasting elementwise + ufuncs, reductions (<code>Sum</code>/<code>Max</code>/<code>ArgMax</code>/<code>CumSum</code>/<code>Clip</code>/<code>Where</code>), manipulation (<code>Reshape</code>/<code>Concatenate</code>/<code>Stack</code>), linalg (<code>MatMul</code>/<code>Dot</code>) via a panel-packed cache-blocked GEMM with a go-asmgen SIMD-FMA micro-kernel (NEON 4&times;8 on arm64, AVX2/FMA 6&times;8 on amd64, VSX 8&times;8 on ppc64le, LASX 8&times;8 on loong64), and a <code>Workspace</code> arena for loops (<code>Use</code>/<code>Reset</code>/<code>Detach</code>)."
[[params.repos]]
  name  = "docs"
  kind  = "site"
  href  = "https://go-ndarray.github.io/docs/"
  blurb = "Versioned documentation site (MkDocs Material): API reference, the roadmap, and honest benchmark pages versus NumPy 2.5.3 / OpenBLAS 0.3.34. <a href=\"https://github.com/go-ndarray/docs\">Source →</a>"
[[params.repos]]
  name  = "brand"
  kind  = "assets"
  href  = "https://github.com/go-ndarray/brand"
  blurb = "Logos and icons for the organization, in SVG / PNG / JPG / ICO / ICNS across colour, white and black variants."

[params.brand]
# Generated by logos/landing-kit/kit.py from static/img/logo.svg: the colours are
# READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 5.48:1, bright on the dark background 10.05:1.
  base = "#047857"
  deep = "#024935"
  bright = "#34d399"
  shadow = "rgba(4,120,87,.7)"
  glow = "rgba(4,120,87,.6)"
  wash = "rgba(4,120,87,.10)"
  washDeep = "rgba(2,73,53,.06)"
  chipBg = "#e7faf3"
  chipBorder = "#c2f2e0"
  chipFg = "#024935"
  chipBgDark = "rgba(52,211,153,.14)"
  chipBorderDark = "rgba(52,211,153,.32)"
  chipFgDark = "#8fe7c7"

# The API cards (#api) and the count in the hero come from this list, never
# from a number typed beside it.
[[params.families]]
  name = "Creation"
  what = "`Zeros`, `Ones`, `Full`, `Arange`, `Linspace`, `FromData`, `Eye` and the rest of NumPy's constructors, float64 throughout."
[[params.families]]
  name = "Views and indexing"
  what = "`Reshape`, `Transpose` and NumPy basic indexing with `Slice(All(), A(0), …)`: strided views that share data, no copy."
[[params.families]]
  name = "Broadcasting and ufuncs"
  what = "Elementwise arithmetic with NumPy broadcasting, and the unary functions, including `Exp` and `Log` ported from Arm's optimized-routines (≤ 0.51 ULP)."
[[params.families]]
  name = "Reductions"
  what = "`Sum`, `Mean`, `Max`, `ArgMax`, `CumSum`, `Clip`, `Where`, whole-array or along an axis, multicore on large arrays."
[[params.families]]
  name = "Manipulation"
  what = "`Concatenate`, `Stack` and the shape operations NumPy users reach for."
[[params.families]]
  name = "Linear algebra"
  what = "`MatMul` and `Dot` through a panel-packed, cache-blocked GEMM with a go-asmgen SIMD micro-kernel per architecture."
[[params.families]]
  name = "Workspace"
  what = "An arena for loops: `Use`, `Reset`, `Detach` — results stop costing the garbage collector from one pass to the next."
